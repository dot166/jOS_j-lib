[versions]
activityCompose = "1.13.0"
agp = "9.3.3"
coreKtx = "1.19.1"
gson = "2.14.0"
liblauncher3 = "1.2.0"
maven = "0.37.0"
material3Android = "1.5.0-beta01"
compose = "2.4.20"
ui = "1.13.0-beta01"
generateBp = "+"
ksp = "2.3.11"
patrickgold-jetpref = "0.5.0-a04-SNAPSHOT"
navigationCompose = "2.10.2"
compose-icons = "1.7.8"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose" }
lineageos-generatebp = { id = "org.lineageos.generatebp", version.ref = "generateBp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
liblauncher3 = { module = "io.github.dot166:LibLauncher3", version.ref = "liblauncher3" }
androidx-material3-android = { module = "androidx.compose.material3:material3-android", version.ref = "material3Android" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "ui" }
patrickgold-jetpref-datastore-model = { module = "dev.patrickgold.jetpref:jetpref-datastore-model", version.ref = "patrickgold-jetpref" }
patrickgold-jetpref-datastore-model-processor = { module = "dev.patrickgold.jetpref:jetpref-datastore-model-processor", version.ref = "patrickgold-jetpref" }
patrickgold-jetpref-datastore-ui = { module = "dev.patrickgold.jetpref:jetpref-datastore-ui", version.ref = "patrickgold-jetpref" }
patrickgold-jetpref-material-ui = { module = "dev.patrickgold.jetpref:jetpref-material-ui", version.ref = "patrickgold-jetpref" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-icons" }
