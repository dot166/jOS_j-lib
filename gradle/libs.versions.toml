[versions]
activityCompose = "1.13.0"
agp = "9.3.1"
appcompat = "1.7.1"
coreKtx = "1.19.0"
dagger = "2.60.1"
gson = "2.14.0"
liblauncher3 = "1.1.3"
material = "1.14.0"
maven = "0.37.0"
material3Android = "1.5.0-alpha25"
compose = "2.4.10"
ui = "1.11.4"
settingsLib = "137.0.2026062500"
generateBp = "+"
ksp = "2.3.9"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose" }
lineageos-generatebp = { id = "org.lineageos.generatebp", version.ref = "generateBp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
liblauncher3 = { module = "io.github.dot166:LibLauncher3", version.ref = "liblauncher3" }
material = { module = "com.google.android.material:material", version.ref = "material" }
settingsLib = { module = "io.github.dot166:SettingsLib", version.ref = "settingsLib"}
androidx-material3-android = { module = "androidx.compose.material3:material3-android", version.ref = "material3Android" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "ui" }
